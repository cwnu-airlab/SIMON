upstream backend {
    server backend:8000;
}

upstream frontend {
    server frontend:3000;
}

# vLLM round-robin (default load balancing). Reached only via the internal
# server block on port 8081 — never exposed to host or external clients.
upstream vllm {
    server vllm0:8000;
    server vllm1:8000;
}

# External-facing server (mapped to host port 3080).
server {
    listen 80;
    server_name _;

    client_max_body_size 60M;

    # API requests -> FastAPI backend
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE streaming support
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
        proxy_set_header Connection '';
    }

    # OpenAI-compatible API requests -> FastAPI backend (auth + proxy to vLLM)
    location /v1/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE streaming support
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
        proxy_set_header Connection '';
    }

    # Everything else -> SvelteKit frontend
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# Internal vLLM load balancer. Listens on 8081 inside the docker network only
# (no `ports:` mapping in compose), so the backend can reach round-robin vLLM
# at http://nginx:8081/v1/... while keeping vllm hidden from the public.
server {
    listen 8081;
    server_name _;

    client_max_body_size 60M;

    location / {
        proxy_pass http://vllm;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # SSE / long generations
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        chunked_transfer_encoding on;
        proxy_set_header Connection '';
    }
}
