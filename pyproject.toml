[project]
name = "simon"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "asyncpg",
    "pydantic-settings",
    "python-multipart",
    "pillow",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
    "pytest-asyncio",
    "httpx",
    "testcontainers[postgres]",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
